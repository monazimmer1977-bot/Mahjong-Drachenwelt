.top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.badge{border:1px solid #f3cd76;border-radius:999px;background:linear-gradient(#5d3b67,#2e2148);color:#fff1c4;padding:7px 11px;font-weight:bold;box-shadow:inset 0 1px #fff6}.progress{height:8px;background:#d9c9d8;border-radius:9px;overflow:hidden;margin:10px 0}.progress div{height:100%;background:linear-gradient(90deg,#54d6ed,#f7d15f,#ed8ec1);width:0;transition:width .35s}

.tile:before{content:"";position:absolute;inset:4px;border:1px solid #cda65f;border-radius:7px;pointer-events:none;box-shadow:inset 0 0 7px #e5c98755}.tile{background:linear-gradient(145deg,#fffef9 0%,#f8edda 35%,#e8d0a6 100%);border:1px solid #fff3c8;box-shadow:0 5px 0 #94683d,0 8px 13px #09051f88,inset 0 2px 2px #fff,inset 0 -3px 4px #b9955d66}.tile:after{content:"";position:absolute;left:10%;right:10%;bottom:5px;height:3px;border-radius:50%;background:#d9bd88;opacity:.55}.tile:hover{transform:translateY(-3px);filter:brightness(1.06)}.tile:active{transform:translateY(1px)}.tile.selected{outline:3px solid #ffe16e;box-shadow:0 0 0 3px #f4a7ff,0 0 22px #ffd85d;transform:translateY(-4px)}.tile.gone{visibility:hidden;pointer-events:none}.tile.pop{animation:pop .42s ease-out forwards}@keyframes pop{0%{transform:scale(1);opacity:1;filter:brightness(1)}35%{transform:scale(1.22);filter:brightness(2.2);box-shadow:0 0 25px #ffe66b}100%{transform:scale(.2) rotate(18deg);opacity:0}}
.tray{margin-top:12px;border:2px solid #f1c86e;border-radius:17px;padding:9px;background:linear-gradient(145deg,#261739,#58366b);box-shadow:inset 0 2px 10px #0b071b,0 0 20px #ffc55d22}.traytitle{font-size:.83rem;color:#ffe6a3;text-align:center;margin-bottom:7px}.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.slot{height:58px;border-radius:10px;border:1px dashed #d8b67b;background:#180f2a88;display:flex;align-items:center;justify-content:center;font-size:1.8rem;box-shadow:inset 0 0 8px #0005}.slot.filled{border:1px solid #f8d78b;background:linear-gradient(145deg,#fff7e6,#e5cda2);box-shadow:0 3px 0 #997044,0 0 10px #ffcf5b22}.slot.new{animation:slotIn .25s ease-out}@keyframes slotIn{from{transform:translateY(-16px) scale(.7);opacity:.2}to{transform:none;opacity:1}}
