
name: Mahjong Drachenwelt APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: SDK-Tools prüfen
        run: |
         yes | sdkmanager --sdk_root="$ANDROID_HOME" "cmdline-tools;latest" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
         

      - name: Projektdateien anzeigen
        run: |
          echo "Dateien im Repository:"
          find . -maxdepth 4 -type f | head -200
