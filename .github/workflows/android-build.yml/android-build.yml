
name: Mahjong Drachenwelt APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Projekt entpacken
        run: |
          unzip -q MahjongDrachenwelt_AndroidStudio_Projekt.zip -d buildsrc
          find buildsrc -maxdepth 5 -type f

      - name: APK bauen
        run: |
          PROJECT_DIR=$(find buildsrc -name settings.gradle.kts -printf '%h\n' | head -1)
          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find buildsrc -name settings.gradle -printf '%h\n' | head -1)
          fi
          test -n "$PROJECT_DIR"
          gradle --no-daemon -p "$PROJECT_DIR" assembleDebug

      - name: APK zum Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Mahjong-Drachenwelt-APK
          path: buildsrc/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
